[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
krkrz_core = { path = "crates/krkrz_core" }
krkrz_assets = { path = "crates/krkrz_assets" }
krkrz_tjs = { path = "crates/krkrz_tjs" }
krkrz_kag = { path = "crates/krkrz_kag" }
krkrz_runtime = { path = "crates/krkrz_runtime" }
