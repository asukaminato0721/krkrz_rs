name: Autofix

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autofix
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcb1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev

      # clippy first: its machine-applied fixes are not guaranteed to be
      # rustfmt-clean, so fmt runs last to normalize the result.
      - name: cargo clippy --fix
        run: cargo clippy --locked --workspace --all-targets --fix --allow-dirty --allow-staged

      - name: cargo fmt
        run: cargo fmt --all

      # Uses the default GITHUB_TOKEN, so the build workflow does not run on
      # this PR automatically; close and reopen it to trigger CI.
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: autofix/fmt-clippy
          delete-branch: true
          commit-message: "autofix: cargo fmt + clippy --fix"
          title: "autofix: cargo fmt + clippy --fix"
          body: |
            Automated `cargo clippy --fix` followed by `cargo fmt --all`.

            CI does not start automatically on this PR; close and reopen it to run the build.
